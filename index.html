<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人交易日誌與風控統計儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (用於匯出 Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頁首標題 -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2">
                    📈 交易損益日誌與風控系統
                </h1>
                <p class="text-slate-400 text-sm mt-1">追蹤每筆交易的執行紀律、期望值與風報比</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow">
                    📥 匯出 Excel (.xlsx)
                </button>
            </div>
        </header>

        <!-- 頂部數據統計卡片區塊 -->
        <section class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">總交易筆數</span>
                <span id="stat-total-trades" class="text-xl font-bold text-white mt-1 block">0</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">勝率 (Win Rate)</span>
                <span id="stat-win-rate" class="text-xl font-bold text-white mt-1 block">0%</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">累積淨損益</span>
                <span id="stat-net-pnl" class="text-xl font-bold text-white mt-1 block">$0</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">平均盈虧比 (Payoff)</span>
                <span id="stat-payoff-ratio" class="text-xl font-bold text-amber-400 mt-1 block">0.00</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">每筆期望值 (EV)</span>
                <span id="stat-ev" class="text-xl font-bold text-sky-400 mt-1 block">$0</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5">
                <span class="text-slate-400 text-xs block font-medium">總手續費/稅</span>
                <span id="stat-total-fee" class="text-xl font-bold text-rose-400 mt-1 block">$0</span>
            </div>
        </section>

        <!-- 主區塊：左側輸入表單 / 右側歷史紀錄列表 -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 新增交易表單 (4欄寬) -->
            <section class="lg:col-span-4 bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 h-fit">
                <h2 class="text-lg font-semibold text-white mb-4 border-b border-slate-700 pb-2">新增交易紀錄</h2>
                <form id="trade-form" onsubmit="addRecord(event)" class="space-y-4">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">交易日期</label>
                            <input type="date" id="input-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">交易平台/券商</label>
                            <input type="text" id="input-platform" placeholder="例如：統一、國泰" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">交易標的 / 代號</label>
                            <input type="text" id="input-asset" placeholder="例如：2330 台積電" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">交易策略分類</label>
                            <select id="input-strategy" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                <option value="開盤突破">開盤突破</option>
                                <option value="VWAP回測">VWAP回測</option>
                                <option value="動能當沖">動能當沖</option>
                                <option value="關鍵關卡彈">關鍵關卡彈</option>
                                <option value="波段續抱">波段續抱</option>
                                <option value="其他/隨意進場">其他/隨意進場</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">實現損益 (NTD)</label>
                            <input type="number" id="input-pnl" step="any" placeholder="正數賺 / 負數賠" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">手續費 & 交易稅</label>
                            <input type="number" id="input-fee" min="0" step="any" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <!-- 風控規劃 (事前提估) -->
                    <div class="p-3 bg-slate-900/50 border border-slate-700/50 rounded-lg space-y-3">
                        <span class="text-xs font-semibold text-slate-400 block">事前風控規劃 (預期)</span>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">預計停利目標 (TP)</label>
                                <input type="number" id="input-tp" min="0" step="any" placeholder="預期金額" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">最大預期虧損 (SL)</label>
                                <input type="number" id="input-sl" min="0" step="any" placeholder="預期金額" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">交易檢討 / 心態紀錄</label>
                        <textarea id="input-note" rows="2" placeholder="是否有遵守停損？進場理由是否成立？" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow">
                        ➕ 新增交易紀錄
                    </button>
                </form>
            </section>

            <!-- 歷史紀錄表格 (8欄寬) -->
            <section class="lg:col-span-8 bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-lg font-semibold text-white">交易歷史明細</h2>
                        <span class="text-xs text-slate-400">所有金額均以新台幣 (NTD) 計算</span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900/80 text-xs text-slate-400 uppercase border-b border-slate-700">
                                <tr>
                                    <th class="py-3 px-2">日期</th>
                                    <th class="py-3 px-2">標的/策略</th>
                                    <th class="py-3 px-2 text-right">實現損益</th>
                                    <th class="py-3 px-2 text-right">淨損益</th>
                                    <th class="py-3 px-2 text-center">預期/實際風報比</th>
                                    <th class="py-3 px-2">備註</th>
                                    <th class="py-3 px-2 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="trade-list-body" class="divide-y divide-slate-800">
                                <!-- 動態渲染明細 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        // 從 LocalStorage 載入歷史資料
        let records = JSON.parse(localStorage.getItem('trade_records')) || [];

        // 初始化預設日期為今天
        document.getElementById('input-date').valueAsDate = new Date();

        // 頁面載入時初始渲染
        renderUI();

        // 新增交易紀錄
        function addRecord(e) {
            e.preventDefault();

            const pnl = parseFloat(document.getElementById('input-pnl').value) || 0;
            const fee = parseFloat(document.getElementById('input-fee').value) || 0;
            const tp = parseFloat(document.getElementById('input-tp').value) || 0;
            const sl = parseFloat(document.getElementById('input-sl').value) || 0;

            const newRecord = {
                id: Date.now(),
                date: document.getElementById('input-date').value,
                platform: document.getElementById('input-platform').value.trim(),
                asset: document.getElementById('input-asset').value.trim(),
                strategy: document.getElementById('input-strategy').value,
                pnl: pnl,
                fee: fee,
                targetProfit: tp,
                maxLoss: sl,
                note: document.getElementById('input-note').value.trim()
            };

            records.unshift(newRecord); // 優先放入最新紀錄
            saveAndRender();

            // 重置表單數值（保留日期與平台方便連續輸入）
            document.getElementById('input-asset').value = '';
            document.getElementById('input-pnl').value = '';
            document.getElementById('input-fee').value = '';
            document.getElementById('input-tp').value = '';
            document.getElementById('input-sl').value = '';
            document.getElementById('input-note').value = '';
        }

        // 刪除紀錄
        function deleteRecord(id) {
            if (confirm('確定要刪除這筆交易紀錄嗎？')) {
                records = records.filter(r => r.id !== id);
                saveAndRender();
            }
        }

        // 儲存並更新 UI
        function saveAndRender() {
            localStorage.setItem('trade_records', JSON.stringify(records));
            renderUI();
        }

        // 渲染儀表板與數據計算
        function renderUI() {
            const tbody = document.getElementById('trade-list-body');
            tbody.innerHTML = '';

            let totalTrades = records.length;
            let winCount = 0;
            let totalNetPnL = 0;
            let totalFee = 0;
            let totalWinAmount = 0;
            let totalLossAmount = 0;
            let lossCount = 0;

            records.forEach(r => {
                const netPnL = r.pnl - r.fee;
                totalNetPnL += netPnL;
                totalFee += r.fee;

                if (netPnL > 0) {
                    winCount++;
                    totalWinAmount += netPnL;
                } else if (netPnL < 0) {
                    lossCount++;
                    totalLossAmount += Math.abs(netPnL);
                }

                // 計算風報比
                const planRRR = (r.targetProfit && r.maxLoss && r.maxLoss > 0) ? (r.targetProfit / r.maxLoss).toFixed(2) : '-';
                const actualRRR = (r.maxLoss && r.maxLoss > 0) ? (netPnL / r.maxLoss).toFixed(2) : '-';

                // 產生表格行
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition";
                
                const pnlClass = netPnL > 0 ? "text-emerald-400 font-semibold" : (netPnL < 0 ? "text-rose-400 font-semibold" : "text-slate-400");

                tr.innerHTML = `
                    <td class="py-3 px-2 text-xs text-slate-400 whitespace-nowrap">${r.date}</td>
                    <td class="py-3 px-2">
                        <div class="font-medium text-white">${r.asset}</div>
                        <div class="text-xs text-slate-400">${r.platform} · <span class="text-indigo-400">${r.strategy}</span></div>
                    </td>
                    <td class="py-3 px-2 text-right font-mono">${r.pnl >= 0 ? '+' : ''}${r.pnl.toLocaleString()}</td>
                    <td class="py-3 px-2 text-right font-mono ${pnlClass}">${netPnL >= 0 ? '+' : ''}${netPnL.toLocaleString()}</td>
                    <td class="py-3 px-2 text-center text-xs font-mono">
                        <span class="text-slate-400" title="預期風報比">預: ${planRRR}</span> / 
                        <span class="${parseFloat(actualRRR) >= 1 ? 'text-emerald-400' : 'text-slate-300'}" title="實際風險報酬倍數">實: ${actualRRR}</span>
                    </td>
                    <td class="py-3 px-2 text-xs text-slate-400 max-w-[150px] truncate" title="${r.note}">${r.note || '-'}</td>
                    <td class="py-3 px-2 text-center">
                        <button onclick="deleteRecord(${r.id})" class="text-slate-500 hover:text-rose-400 transition text-xs">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 計算風控核心指標
            const winRate = totalTrades > 0 ? ((winCount / totalTrades) * 100).toFixed(1) : 0;
            const avgWin = winCount > 0 ? (totalWinAmount / winCount) : 0;
            const avgLoss = lossCount > 0 ? (totalLossAmount / lossCount) : 0;
            const payoffRatio = avgLoss > 0 ? (avgWin / avgLoss).toFixed(2) : (avgWin > 0 ? '∞' : '0.00');
            
            // 期望值 EV = (勝率 * 平均獲利) - (敗率 * 平均虧損)
            const winProb = totalTrades > 0 ? (winCount / totalTrades) : 0;
            const lossProb = totalTrades > 0 ? (lossCount / totalTrades) : 0;
            const ev = Math.round((winProb * avgWin) - (lossProb * avgLoss));

            // 更新頂部卡片
            document.getElementById('stat-total-trades').innerText = totalTrades;
            document.getElementById('stat-win-rate').innerText = `${winRate}%`;
            
            const netPnLElem = document.getElementById('stat-net-pnl');
            netPnLElem.innerText = `${totalNetPnL >= 0 ? '+' : ''}$${totalNetPnL.toLocaleString()}`;
            netPnLElem.className = `text-xl font-bold mt-1 block ${totalNetPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            document.getElementById('stat-payoff-ratio').innerText = payoffRatio;
            
            const evElem = document.getElementById('stat-ev');
            evElem.innerText = `${ev >= 0 ? '+' : ''}$${ev.toLocaleString()}`;
            evElem.className = `text-xl font-bold mt-1 block ${ev >= 0 ? 'text-sky-400' : 'text-rose-400'}`;

            document.getElementById('stat-total-fee').innerText = `$${totalFee.toLocaleString()}`;
        }

        // 匯出至 Excel (.xlsx) 函式
        function exportToExcel() {
            if (!records || records.length === 0) {
                alert('目前沒有交易紀錄可供匯出！');
                return;
            }

            // 格式化欄位給 Excel
            const excelData = records.map(r => {
                const netPnL = r.pnl - r.fee;
                const planRRR = (r.targetProfit && r.maxLoss && r.maxLoss > 0) ? (r.targetProfit / r.maxLoss).toFixed(2) : '-';
                const actualRRR = (r.maxLoss && r.maxLoss > 0) ? (netPnL / r.maxLoss).toFixed(2) : '-';

                return {
                    "交易日期": r.date,
                    "券商平台": r.platform,
                    "交易標的": r.asset,
                    "策略分類": r.strategy,
                    "實現損益 (NTD)": r.pnl,
                    "手續費與稅 (NTD)": r.fee,
                    "淨損益 (NTD)": netPnL,
                    "預計獲利 (TP)": r.targetProfit || 0,
                    "預計停損 (SL)": r.maxLoss || 0,
                    "預期風報比": planRRR,
                    "實際風險R數": actualRRR,
                    "交易檢討與備註": r.note || ''
                };
            });

            // 使用 SheetJS 建構工作表
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "交易明細日誌");

            // 自動設定 Excel 欄寬
            worksheet['!cols'] = [
                { wch: 12 }, // 日期
                { wch: 12 }, // 平台
                { wch: 15 }, // 標的
                { wch: 14 }, // 策略
                { wch: 14 }, // 實現損益
                { wch: 14 }, // 手續費
                { wch: 14 }, // 淨損益
                { wch: 12 }, // TP
                { wch: 12 }, // SL
                { wch: 10 }, // 預期風報比
                { wch: 10 }, // 實際R數
                { wch: 30 }  // 備註
            ];

            // 下載 XLSX 檔案
            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `交易日誌紀錄_${dateStr}.xlsx`);
        }
    </script>
</body>
</html>
